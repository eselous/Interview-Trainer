<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Interview Trainer</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>Interview Trainer</h1>

    <div id="setup">
      <label for="position">Zadaj svoju pracovnú pozíciu:</label>
      <input type="text" id="position" placeholder="napr. junior marketingový špecialista" maxlength="120">
      <p id="positionError" class="error hidden"></p>
      <button id="startBtn">Začať</button>
      <button id="historyBtn" type="button" class="secondaryBtn">📊 Zobraziť históriu</button>
    </div>

    <div id="historyView" class="hidden">
      <div class="topControls">
        <button id="historyBackBtn" type="button" class="secondaryBtn">← Späť</button>
      </div>
      <h3>Tvoj progres</h3>
      <p id="statsText"></p>
      <canvas id="scoreChart" height="100"></canvas>
      <h3>Posledné pokusy</h3>
      <div id="historyList"></div>
    </div>

    <div id="interview" class="hidden">
      <div class="topControls">
        <button id="backBtn" type="button" class="secondaryBtn">← Späť na výber</button>
        <button id="skipBtn" type="button" class="secondaryBtn">Preskočiť otázku</button>
      </div>

      <h2 id="questionText"></h2>
      <textarea id="answerInput" rows="6" placeholder="Napíš svoju odpoveď alebo použi mikrofón..."></textarea>
      <div class="controls">
        <button id="micBtn" type="button">🎤 Nahrávať</button>
        <span id="recordingStatus" class="hidden">🔴 Nahráva sa...</span>
      </div>
      <button id="submitBtn">Odoslať odpoveď</button>
    </div>

    <div id="feedback" class="hidden">
      <h3>Vyhodnotenie</h3>
      <p><strong>Skóre:</strong> <span id="scoreValue"></span>/10</p>
      <p><strong>Silné stránky:</strong> <span id="strengthsText"></span></p>
      <p><strong>Na zlepšenie:</strong> <span id="improvementsText"></span></p>
      <div class="topControls">
        <button id="feedbackBackBtn" type="button" class="secondaryBtn">← Späť na výber</button>
        <button id="nextBtn">Ďalšia otázka</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
